<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08090d">
  <meta name="description" content="Bear Haven browser game">
  <title>Bear Haven</title>

  <!-- Primary CDN. All relative GWT files resolve from this repository folder. -->
  <base href="https://cdn.jsdelivr.net/gh/lostgemsy/gameList-284@main/Bear-Haven/">

  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #08090d;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }
    #embed-html {
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #embed-html canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
      outline: none;
      cursor: default;
    }
    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 13px;
      padding: 24px;
      background: radial-gradient(ellipse at center, #1b202b 0%, #0b0d13 55%, #050609 100%);
      text-align: center;
      transition: opacity .35s ease, visibility .35s ease;
    }
    #loading-screen.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .loader-ring {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(255,255,255,.13);
      border-top-color: #e8edf7;
      border-radius: 50%;
      animation: spin .85s linear infinite;
    }
    #loading-title {
      margin: 4px 0 0;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: .13em;
    }
    #loading-status {
      max-width: 440px;
      margin: 0;
      color: #aeb7c7;
      font-size: 13px;
      line-height: 1.5;
    }
    #retry-button {
      display: none;
      margin-top: 8px;
      padding: 10px 18px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 8px;
      background: #fff;
      color: #111;
      font-weight: 700;
      cursor: pointer;
    }
    #retry-button:hover { background: #dce3ef; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .loader-ring { animation-duration: 2.5s; }
      #loading-screen { transition: none; }
    }
  </style>
</head>
<body>
  <main id="embed-html" aria-label="Bear Haven game"></main>

  <section id="loading-screen" role="status" aria-live="polite">
    <div class="loader-ring" aria-hidden="true"></div>
    <h1 id="loading-title">BEAR HAVEN</h1>
    <p id="loading-status">Connecting to the game CDN...</p>
    <button id="retry-button" type="button" onclick="location.reload()">Retry loading</button>
  </section>

  <script>
    (() => {
      "use strict";

      const CDN_BASE = "https://cdn.jsdelivr.net/gh/lostgemsy/gameList-284@main/Bear-Haven/";
      const RAW_BASE = "https://raw.githubusercontent.com/lostgemsy/gameList-284/main/Bear-Haven/";
      const statusText = document.getElementById("loading-status");
      const loadingScreen = document.getElementById("loading-screen");
      const retryButton = document.getElementById("retry-button");
      const baseElement = document.querySelector("base");

      let gameScriptStarted = false;
      let gameReady = false;

      function setStatus(message) {
        statusText.textContent = message;
      }

      function showError(message) {
        setStatus(message || "The game could not be loaded. Check your connection and try again.");
        retryButton.style.display = "inline-block";
        document.querySelector(".loader-ring").style.display = "none";
      }

      function hideLoader() {
        if (gameReady) return;
        gameReady = true;
        loadingScreen.classList.add("is-hidden");
        setTimeout(() => loadingScreen.remove(), 500);
      }

      // GWT creates the game canvas after its compiled module has started.
      const gameObserver = new MutationObserver(() => {
        if (document.querySelector("#embed-html canvas")) {
          setStatus("Game started.");
          hideLoader();
          gameObserver.disconnect();
        }
      });
      gameObserver.observe(document.getElementById("embed-html"), {
        childList: true,
        subtree: true
      });

      // CrazyGames SDK is optional for the game to start. A blocked SDK must not
      // prevent the actual game files from loading.
      window.crazysdk = null;
      window.sdk = null;

      function initCrazyGamesSDK() {
        try {
          if (!window.CrazyGames || !window.CrazyGames.CrazySDK) return;
          window.crazysdk = window.CrazyGames.CrazySDK.getInstance();
          window.sdk = window.crazysdk;
          window.crazysdk.init();
        } catch (error) {
          console.warn("CrazyGames SDK could not initialize:", error);
        }
      }

      const crazyScript = document.createElement("script");
      crazyScript.src = "https://sdk.crazygames.com/crazygames-sdk-v1.js";
      crazyScript.async = true;
      crazyScript.onload = initCrazyGamesSDK;
      crazyScript.onerror = () => console.warn("CrazyGames SDK unavailable; continuing without it.");
      document.head.appendChild(crazyScript);

      function muteGame(muted) {
        try {
          if (typeof window.adw === "function") window.adw(muted ? "mute" : "unmute");
        } catch (error) {
          console.warn("Game audio callback failed:", error);
        }
      }

      function removeAdListeners() {
        const sdk = window.crazysdk;
        if (!sdk) return;
        ["adStarted", "adFinished", "adError"].forEach(eventName => {
          try { sdk.removeEventListener(eventName, adCallbacks[eventName]); } catch (_) {}
        });
      }

      const adCallbacks = {
        adStarted: () => muteGame(true),
        adFinished: () => muteGame(false),
        adError: () => muteGame(false)
      };

      window.showFullscreenAd = function() {
        const sdk = window.crazysdk;
        if (!sdk) return;
        removeAdListeners();
        Object.entries(adCallbacks).forEach(([name, callback]) => {
          sdk.addEventListener(name, callback);
        });
        try { sdk.requestAd("midgame"); } catch (error) {
          console.warn("Fullscreen ad request failed:", error);
          muteGame(false);
        }
      };

      window.showRewardedAd = window.showFullscreenAd;

      function loadGameBootstrap(useFallback) {
        if (gameScriptStarted) return;
        gameScriptStarted = true;

        const sourceBase = useFallback ? RAW_BASE : CDN_BASE;
        baseElement.href = sourceBase;
        const script = document.createElement("script");
        script.type = "text/javascript";
        script.src = sourceBase + "html/html.nocache.js";
        script.async = true;

        script.onload = () => {
          setStatus("Game files downloaded. Starting Bear Haven...");
          // The GWT bootstrap loads its browser-specific compiled module next.
        };

        script.onerror = () => {
          script.remove();
          if (!useFallback) {
            gameScriptStarted = false;
            setStatus("Primary CDN unavailable. Trying the backup CDN...");
            loadGameBootstrap(true);
          } else {
            showError("Both game CDNs failed to respond. Please try again later.");
          }
        };

        document.head.appendChild(script);
      }

      window.addEventListener("error", event => {
        if (event.target && event.target !== window && event.target.tagName === "SCRIPT") {
          console.error("Game resource failed:", event.target.src);
        }
      }, true);

      window.addEventListener("unhandledrejection", event => {
        console.error("Game loading error:", event.reason);
      });

      document.addEventListener("contextmenu", event => event.preventDefault());

      // Keep mouse input inside the game and prevent the page from stealing focus.
      const gameContainer = document.getElementById("embed-html");
      ["mousedown", "mouseup"].forEach(type => {
        gameContainer.addEventListener(type, event => {
          event.preventDefault();
          event.stopPropagation();
          window.focus();
        }, false);
      });

      // GWT sometimes takes longer on a cold CDN cache; show a useful message
      // instead of leaving a silent blank page.
      setTimeout(() => {
        if (!gameReady && retryButton.style.display !== "inline-block") {
          setStatus("Still loading game files... Large files may take a little longer.");
        }
      }, 25000);

      setTimeout(() => {
        if (!gameReady) showError("The game is taking too long to start. Check your connection and retry.");
      }, 90000);

      loadGameBootstrap(false);
    })();
  </script>
</body>
</html>
