<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>DON'T SPLASH</title>
  <meta name="theme-color" content="#101827">
  <meta name="description" content="Don't fall in. Don't make a sound. It hears you.">
  <meta name="color-scheme" content="dark">
  <style>
    html, body { width:100%; height:100%; margin:0; overflow:hidden; }
    canvas#gl { position:fixed; inset:0; z-index:0; display:block; }
    #hud { position:fixed; inset:0; z-index:20; pointer-events:none; }
    #overlay { position:fixed; inset:0; z-index:10; pointer-events:none; visibility:visible; opacity:1; }
    #overlay .panel-screen { position:absolute; inset:0; pointer-events:auto; }
    #overlay #menu:not(.hidden) { display:flex; visibility:visible; opacity:1; }
    #overlay .panel-screen.hidden { display:none !important; }
  </style>
  <link rel="icon" href="https://cdn.jsdelivr.net/gh/lostgemsy/gameList-284@main/Dont-Splash/logo.webp" type="image/webp" />
  
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
  <script type="module" crossorigin="anonymous" src="https://cdn.jsdelivr.net/gh/lostgemsy/gameList-284@main/Dont-Splash/assets/index-Dhww41g5.js"></script>
  <style>
    #dsmp[hidden],#dsmp.off{display:none!important}
    #multiplayerOpenBtn{margin-top:14px;min-width:210px;padding:13px 22px;border:2px solid #8ed5ff;border-radius:12px;background:#1769b2;color:#fff;font:900 16px Nunito,Arial,sans-serif;cursor:pointer;box-shadow:0 5px 0 #0b345b,0 8px 18px #0006}
    #multiplayerOpenBtn:hover{filter:brightness(1.15);transform:translateY(-1px)}
    #multiplayerOpenBtn:active{transform:translateY(2px);box-shadow:0 2px 0 #0b345b}
    #menu .play-row{display:flex!important;gap:12px;justify-content:center;flex-wrap:wrap}
    #dsmp .ds-close-x{position:absolute;top:9px;right:10px;width:42px;height:42px;padding:0;margin:0;border:2px solid #9bb9d8;border-radius:50%;background:#b72e3c;color:#fff;font:900 30px/1 Arial,sans-serif;display:grid;place-items:center;z-index:5;box-shadow:0 3px 0 #641923}
    #dsmp .ds-close-x:hover{background:#e04455;transform:scale(1.05)}
    #dsmp .card{padding-top:58px}
  </style>
  <link rel="stylesheet" crossorigin="anonymous" href="https://cdn.jsdelivr.net/gh/lostgemsy/gameList-284@main/Dont-Splash/assets/index-DIsvQiZr.css">
  <!-- GameMonetize SDK (interstitials). src/ads.js pauses + mutes on SDK_GAME_PAUSE, resumes on SDK_GAME_START. -->
  <script type="text/javascript">
    window.SDK_OPTIONS = {
      gameId: "xfyxlaku2ksfgh7wp1pgyr8bi5clmnfi",
      onEvent: function (event) {
        if (event.name === "SDK_GAME_PAUSE") window.__gmPaused = true;
        if (event.name === "SDK_GAME_START") window.__gmPaused = false;
        window.dispatchEvent(new CustomEvent("gamemonetize", { detail: event }));
      }
    };
    (function (d, s, id) {
      var js, fjs = d.getElementsByTagName(s)[0];
      if (d.getElementById(id)) return;
      js = d.createElement(s);
      js.id = id;
      js.src = "https://api.gamemonetize.com/sdk.js";
      fjs.parentNode.insertBefore(js, fjs);
    }(document, "script", "gamemonetize-sdk"));
  </script>
</head>
<body>
  <canvas id="gl"></canvas>

  <!-- Per-view HUD layers are created by JS inside #hud -->
  <div id="hud">
    <div id="splitBar" class="hidden"></div>
    <div id="pauseWrap" class="hidden">
      <button id="pauseBtn" aria-label="Pause"><i></i><i></i></button>
      <span class="pk">(P)</span>
    </div>
  </div>

  <!-- Shared overlays -->
  <div id="overlay">
    <!-- MAIN MENU -->
    <section id="menu" class="panel-screen">
      <div class="menu-top">
        <div id="bestLine" class="best-line">BEST TIME = --:--.-</div>
        <button id="howBtn" class="icon-btn" title="How to play">?</button>
        <button id="settingsBtn" class="icon-btn" title="Settings">⚙</button>
      </div>
      <div class="menu-wrap">
        <div class="menu-main">
          <img class="logo" src="https://cdn.jsdelivr.net/gh/lostgemsy/gameList-284@main/Dont-Splash/logo.webp" alt="DON'T SPLASH" draggable="false" />
          <p class="tagline" data-i18n="tagline">Don't fall in. Don't make a sound. It hears you.</p>
          <button id="multiplayerOpenBtn" type="button">ONLINE MULTIPLAYER</button>
          <div class="play-row">
            <button id="p1Btn" class="rbx-btn green"><span data-i18n="player1">1 PLAYER</span></button>
            <button id="p2Btn" class="rbx-btn blue"><span data-i18n="player2">2 PLAYERS</span></button>
          </div>
          <div class="rbx-seg" id="diffSeg">
            <button data-diff="easy" class="on" data-i18n="easy">EASY</button>
            <button data-diff="normal" data-i18n="normal">NORMAL</button>
            <button data-diff="hard" id="hardBtn">HARD 🔒</button>
          </div>
          <div class="hint" id="diffHint"></div>
          <a id="meyaLink" class="meya" href="https://meyagames.com/?utm_source=dont-splash&utm_medium=game&utm_campaign=main_menu&utm_content=logo" target="_blank" rel="noopener">
            <img src="https://cdn.jsdelivr.net/gh/lostgemsy/gameList-284@main/Dont-Splash/meya-logo.webp" alt="MeyaGames" draggable="false" />
          </a>
        </div>
      </div>
    </section>

    <!-- SETTINGS -->
    <section id="settings" class="panel-screen hidden">
      <div class="card rbx-card">
        <h2 data-i18n="setTitle">SETTINGS</h2>
        <label><span data-i18n="setLang">Language</span>
          <select id="setLang"></select>
        </label>
        <label><span data-i18n="setSens">Mouse sensitivity</span> <input type="range" id="setSens" min="0.2" max="3" step="0.1" /><span id="setSensV"></span></label>
        <label><span data-i18n="setFov">Field of view (FOV)</span> <input type="range" id="setFov" min="60" max="100" step="1" /><span id="setFovV"></span></label>
        <label><span data-i18n="setVol">Volume</span> <input type="range" id="setVol" min="0" max="1" step="0.05" /><span id="setVolV"></span></label>
        <label><input type="checkbox" id="setPush" /> <span data-i18n="setPush">Friendly PUSH</span></label>
        <label><input type="checkbox" id="setShake" /> <span data-i18n="setShake">Camera shake</span></label>
        <label><input type="checkbox" id="setLowQ" /> <span data-i18n="setLowQ">Low quality</span></label>
        <div class="row">
          <button id="resetSaveBtn" class="rbx-btn red small" data-i18n="resetSave">RESET SAVE</button>
          <button class="rbx-btn cream small back" data-i18n="back">BACK</button>
        </div>
      </div>
    </section>

    <!-- HOW TO -->
    <section id="howto" class="panel-screen hidden">
      <div class="card rbx-card">
        <h2 data-i18n="howTitle">HOW TO PLAY</h2>
        <ul class="how">
          <li data-i18n="how1"></li>
          <li data-i18n="how2"></li>
          <li data-i18n="how3"></li>
          <li data-i18n="how4"></li>
          <li data-i18n="how5"></li>
          <li data-i18n="how6"></li>
        </ul>
        <div class="row"><button class="rbx-btn cream small back" data-i18n="back">BACK</button></div>
      </div>
    </section>

    <!-- PAUSE -->
    <section id="pause" class="panel-screen hidden">
      <div class="card rbx-card narrow">
        <h2 data-i18n="pause">PAUSED</h2>
        <button id="resumeBtn" class="rbx-btn green" data-i18n="resume">RESUME</button>
        <button id="quitBtn" class="rbx-btn cream small" data-i18n="mainMenu">MAIN MENU</button>
      </div>
    </section>

    <!-- YOU ESCAPED -->
    <section id="escaped" class="panel-screen hidden">
      <div class="card rbx-card escaped-card">
        <h2 class="esc-title" data-i18n="escaped">YOU ESCAPED</h2>
        <div class="esc-time" id="escTime">00:00.0</div>
        <div class="esc-sub"><span id="escDiff">EASY</span> · <span id="escMode">SOLO</span></div>
        <div class="esc-record" id="escRecord"></div>
        <div class="row">
          <button id="playAgainBtn" class="rbx-btn green" data-i18n="playAgain">PLAY AGAIN</button>
          <button id="lobbyBtn" class="rbx-btn blue" data-i18n="lobby">RETURN TO LOBBY</button>
        </div>
        <div class="muted small" id="autoNext"></div>
      </div>
    </section>
  </div>

  <div id="flash"></div>
  <script type="module">
    const multiplayerButton = document.getElementById("multiplayerOpenBtn");
    let multiplayerModulePromise;

    multiplayerButton.addEventListener("click", async () => {
      multiplayerButton.disabled = true;
      multiplayerButton.textContent = "LOADING MULTIPLAYER...";
      try {
        multiplayerModulePromise ||= import("https://cdn.jsdelivr.net/gh/lostgemsy/gameList-284@main/Dont-Splash/multiplayer.js?v=20261101-fix2");
        const multiplayer = await multiplayerModulePromise;
        const open = multiplayer.openMultiplayer || multiplayer.default?.openMultiplayer;
        if (typeof open !== "function") throw new Error("The downloaded multiplayer.js does not export openMultiplayer(). Refresh the CDN copy and try again.");
        open();
      } catch (error) {
        console.error("Multiplayer failed to load:", error);
        multiplayerButton.textContent = "MULTIPLAYER FAILED - TRY AGAIN";
        multiplayerModulePromise = null;
      } finally {
        multiplayerButton.disabled = false;
        if (multiplayerButton.textContent === "LOADING MULTIPLAYER...") {
          multiplayerButton.textContent = "ONLINE MULTIPLAYER";
        }
      }
    });
  </script>
</body>
</html>
