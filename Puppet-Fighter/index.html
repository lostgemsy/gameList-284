<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Puppet Fighter 2 Player</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111}#unity-container{width:100%;height:100%;display:flex;align-items:center;justify-content:center}canvas{width:100%;height:100%;background:#111;outline:none}#loading{position:absolute;color:white;font:16px Arial;top:50%;left:50%;transform:translate(-50%,-50%)}#bar{width:220px;height:5px;background:#444;margin-top:12px}#fill{height:100%;width:0;background:#fff}</style></head>
<body><div id="unity-container"><canvas id="unity-canvas" tabindex="-1"></canvas><div id="loading">Loading Puppet Fighter…<div id="bar"><div id="fill"></div></div></div></div>
<script src="Build/Puppet Fighter Crazy Games.loader.js"></script>
<script>
const canvas=document.querySelector('#unity-canvas');
const loading=document.querySelector('#loading'),fill=document.querySelector('#fill');
createUnityInstance(canvas,{
  dataUrl:'',
  frameworkUrl:'Build/Puppet Fighter Crazy Games.framework.js.br',
  codeUrl:'Build/Puppet Fighter Crazy Games.wasm.br',
  streamingAssetsUrl:'StreamingAssets',
  companyName:'Puppet Fighter', productName:'Puppet Fighter 2 Player', productVersion:'1.0',
  showBanner:(msg,type)=>console[type==='error'?'error':'warn'](msg)
},progress=>{fill.style.width=(progress*100)+'%';}).then(()=>loading.remove()).catch(err=>{loading.textContent='Game failed to load: '+err;console.error(err);});
</script></body></html>
