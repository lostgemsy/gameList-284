<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#111111">
  <title>Puppet Fighter 2 Player</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111}
    #unity-container{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#111}
    #unity-canvas{width:100%;height:100%;display:block;background:#111;outline:none}
    #loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(80vw,360px);color:#fff;text-align:center;font:15px Arial,sans-serif;z-index:2}
    #bar{height:5px;margin-top:14px;background:#383838;border-radius:8px;overflow:hidden}
    #fill{height:100%;width:0;background:#fff;transition:width .15s}
    #error{display:none;color:#ff7777;margin-top:14px;overflow-wrap:anywhere;font-size:13px}
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      Loading Puppet Fighter…
      <div id="bar"><div id="fill"></div></div>
      <div id="error"></div>
    </div>
  </div>

  <script>
    // All Unity build files are served through jsDelivr from this repository.
    const CDN = "https://cdn.jsdelivr.net/gh/lostgemsy/gameList-284@main/Puppet-Fighter/";
    const BUILD = CDN + "Build/";
    const STREAMING_ASSETS = CDN + "StreamingAssets/";

    const canvas = document.getElementById("unity-canvas");
    const loading = document.getElementById("loading");
    const fill = document.getElementById("fill");
    const errorBox = document.getElementById("error");

    function showError(message) {
      console.error("[Puppet Fighter]", message);
      errorBox.style.display = "block";
      errorBox.textContent = String(message);
      loading.firstChild.textContent = "Unable to start Puppet Fighter";
    }

    window.addEventListener("error", event => {
      console.error("[Puppet Fighter Error]", event.message, event.filename, event.lineno);
    });
    window.addEventListener("unhandledrejection", event => {
      console.error("[Puppet Fighter Promise Error]", event.reason);
    });

    // This build folder does not contain a separate .data file. Supply an
    // empty UnityWebData container; game content is requested from StreamingAssets.
    const emptyUnityData = "data:application/octet-stream;base64,VW5pdHlXZWJEYXRhMS4wAAAUAAAA";

    const loader = document.createElement("script");
    loader.src = BUILD + "Puppet%20Fighter%20Crazy%20Games.loader.js";
    loader.onload = () => {
      createUnityInstance(canvas, {
        dataUrl: emptyUnityData,
        frameworkUrl: BUILD + "Puppet%20Fighter%20Crazy%20Games.framework.js.br",
        codeUrl: BUILD + "Puppet%20Fighter%20Crazy%20Games.wasm.br",
        streamingAssetsUrl: STREAMING_ASSETS,
        companyName: "Puppet Fighter",
        productName: "Puppet Fighter 2 Player",
        productVersion: "1.0",
        showBanner: (message, type) => {
          if (type === "error") showError(message);
          else console.warn("[Unity]", message);
        }
      }, progress => {
        fill.style.width = Math.round(progress * 100) + "%";
      }).then(() => {
        loading.remove();
      }).catch(showError);
    };
    loader.onerror = () => showError("Could not load the Unity loader from jsDelivr.");
    document.body.appendChild(loader);

    document.addEventListener("contextmenu", event => event.preventDefault());
  </script>
</body>
</html>
