<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Stronely 1v1 — Map Preview</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b10;color:#eaf0f8;font:14px system-ui,sans-serif}
    #view{position:fixed;inset:0}header{position:fixed;z-index:2;top:18px;left:20px;padding:12px 16px;background:#101722dd;border:1px solid #293647;border-radius:10px;backdrop-filter:blur(10px)}
    h1{font-size:14px;letter-spacing:.12em;margin:0 0 5px}p{margin:0;color:#aab8c9;font-size:12px}#status{position:fixed;left:20px;bottom:18px;padding:10px 13px;background:#101722dd;border:1px solid #293647;border-radius:8px;color:#c8d4e2}
    #reset{position:fixed;right:20px;top:18px;border:1px solid #34445a;background:#152131;color:#fff;border-radius:8px;padding:10px 14px;cursor:pointer}
  </style>
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.181.2/examples/jsm/"}}
  </script>
</head>
<body>
  <div id="view"></div>
  <header><h1>STRONELY // MAP PREVIEW</h1><p>Drag to orbit · Scroll to zoom · Right-drag to pan</p></header>
  <button id="reset" type="button">RESET VIEW</button>
  <div id="status">Loading main/low_poly.gltf…</div>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const host = document.querySelector('#view');
    const status = document.querySelector('#status');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x080b10);
    scene.fog = new THREE.Fog(0x080b10, 45, 130);

    const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 500);
    camera.position.set(18, 16, 22);

    const renderer = new THREE.WebGLRenderer({ antialias:true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    host.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xcfe5ff, 0x39404a, 2));
    const sun = new THREE.DirectionalLight(0xffffff, 2.2);
    sun.position.set(12, 24, 10);
    scene.add(sun);

    const grid = new THREE.GridHelper(100, 50, 0x34465c, 0x1b2939);
    grid.position.y = -0.025;
    scene.add(grid);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 0, 0);

    let defaultCamera;
    function frameObject(object) {
      const bounds = new THREE.Box3().setFromObject(object);
      if (bounds.isEmpty()) throw new Error('The GLTF contains no visible geometry.');
      const size = bounds.getSize(new THREE.Vector3());
      const center = bounds.getCenter(new THREE.Vector3());

      // Move the model's horizontal center to the world origin and rest its base on y=0.
      object.position.x -= center.x;
      object.position.z -= center.z;
      object.position.y -= bounds.min.y;

      const largest = Math.max(size.x, size.y, size.z, 1);
      const distance = largest * 1.35;
      controls.target.set(0, Math.min(size.y * 0.35, largest * 0.3), 0);
      camera.position.set(distance, distance * 0.78, distance);
      camera.near = Math.max(0.1, largest / 1000);
      camera.far = largest * 20 + 100;
      camera.updateProjectionMatrix();
      controls.update();
      defaultCamera = { position: camera.position.clone(), target: controls.target.clone() };
      status.textContent = 'Map loaded and centered at world origin.';
    }

    new GLTFLoader().load('./main/low_poly.gltf', gltf => {
      const map = gltf.scene;
      scene.add(map);
      frameObject(map);
    }, undefined, error => {
      console.error(error);
      status.textContent = 'Could not load the map. Check that its referenced .bin and texture files are also in main/.';
    });

    document.querySelector('#reset').addEventListener('click', () => {
      if (!defaultCamera) return;
      camera.position.copy(defaultCamera.position);
      controls.target.copy(defaultCamera.target);
      controls.update();
    });

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
